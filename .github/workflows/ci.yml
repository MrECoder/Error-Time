name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run the full test suite
        # Runs both modules' unit + integration test suites (no external
        # infrastructure needed for those). AMQP retry/DLQ Testcontainers
        # tests need Docker, which ubuntu-latest runners provide by default.
        run: mvn -B clean verify

      - name: Publish surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          retention-days: 14

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build (needed before the SBOM plugin can inspect resolved dependencies)
        run: mvn -B -DskipTests package

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: '**/target/*-cyclonedx.*'
          retention-days: 90

  cve-scan:
    name: OWASP dependency-check (CVE scan)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      # Needed only for the SARIF upload step below, so findings show up
      # under the repo's Security > Code scanning tab, not just as a
      # downloadable artifact.
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache the NVD CVE database
        # Without this, every run re-downloads/rebuilds the full NVD feed,
        # which without an API key (see the step below) can take a very
        # long time due to NIST's rate limiting. Keyed loosely (not on any
        # pom hash) since this cache is a CVE database, not a build output -
        # it's fine, and desirable, for it to persist and update across
        # unrelated commits.
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      - name: Run OWASP dependency-check
        # An NVD_API_KEY repo secret is REQUIRED, not just recommended: the
        # NVD API 2.0 client this plugin version bundles rejects an
        # unauthenticated (or empty-string) request outright rather than
        # merely rate-limiting it - confirmed empirically, not stale advice
        # from an older dependency-check version. Request a free key at
        # https://nvd.nist.gov/developers/request-an-api-key and add it as
        # a repo secret named NVD_API_KEY to enable this job; until then it
        # skips with a warning instead of failing every build.
        #
        # -DnvdApiKey must be omitted entirely (not passed as "") when no
        # secret is set - the plugin treats an explicitly-provided-but-blank
        # key as an invalid key and fails the same way a bad key would.
        id: dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::NVD_API_KEY secret is not set - skipping the CVE scan. Request a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a repo secret named NVD_API_KEY to enable this job."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          mvn -B org.owasp:dependency-check-maven:aggregate -DnvdApiKey="$NVD_API_KEY"

      - name: Upload dependency-check report
        if: always() && steps.dependency-check.outputs.ran == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.sarif
          retention-days: 90

      - name: Upload SARIF to code scanning
        if: always() && steps.dependency-check.outputs.ran == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
